[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# SPA fallback — every route that is not a real static asset serves index.html.
# Netlify automatically serves Functions at /.netlify/functions/* before this
# rule is reached, so no explicit redirect for them is needed.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
